<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#070B18; height:100%; }
  body { display:flex; justify-content:center; padding:12px; font-family:'Nunito',sans-serif; }
  #frame { width:100%; max-width:420px; background:#0B1226; border-radius:28px; border:1px solid #1A2340;
    position:relative; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.5); min-height:80vh;
    padding-top: max(28px, env(safe-area-inset-top, 0px)); }
  button, input, textarea { font-family:inherit; }
  button { cursor:pointer; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 4px; }
  .brand { display:flex; align-items:center; gap:8px; }
  .titletext { font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; color:#F4F6FB; }
  .avatar { width:30px; height:30px; border-radius:50%; overflow:hidden; flex-shrink:0; border:2px solid #4ADEDE;
    box-shadow:0 2px 8px rgba(74,222,222,0.35); background:#F2C9A0; }
  .topbtns { display:flex; gap:8px; }
  .iconbtn { width:32px; height:32px; border-radius:50%; border:none; cursor:pointer; background:#1E2748;
    display:flex; align-items:center; justify-content:center; font-size:15px; }
  .content { padding:16px 16px 24px; }

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDS3syAvMtBnp7yHPTiNJjVjlQ_xDysHTc",
  authDomain: "m-allowance.firebaseapp.com",
  projectId: "m-allowance",
  storageBucket: "m-allowance.firebasestorage.app",
  messagingSenderId: "39067996912",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection('masonAllowance').doc('data');
/* ---------------- constants ---------------- */
const JARS = {
  save:  { label:'SAVE',  sub:'for later',  color:'#4ADEDE', glow:'#1B3A4B' },
  give:  { label:'GIVE',  sub:'for others', color:'#B18CFF', glow:'#2A1F4A' },
  spend: { label:'SPEND', sub:'for me',     color:'#FFD84A', glow:'#3A331B' },
};
const REASONS = [
  { label:'Respectful',    icon:'shieldish' },
  { label:'Responsible',   icon:'shield' },
  { label:'Ready to Grow', icon:'leaf' },
];
const CELEBRATION_THEMES = [
  {emoji:'🚀',phrase:'Blast off!'},{emoji:'⭐',phrase:'Superstar!'},{emoji:'🐄',phrase:'Holy cow!'},
  {emoji:'💩',phrase:'No way!'},{emoji:'🍕',phrase:'Pizza party!'},{emoji:'🦖',phrase:'Roar-some!'},
  {emoji:'🤖',phrase:'Beep boop, cha-ching!'},{emoji:'🎉',phrase:'Woohoo!'},{emoji:'🍦',phrase:'Sweet!'},
  {emoji:'🐸',phrase:'Ribbit riches!'},{emoji:'🦄',phrase:'Magical!'},{emoji:'🍩',phrase:'Donut worry, be happy!'},
  {emoji:'🐙',phrase:'Whoa there!'},{emoji:'🎈',phrase:'Up, up, hooray!'},{emoji:'🧦',phrase:'Silly socks!'},
  {emoji:'🐵',phrase:'Monkey business!'},{emoji:'🍔',phrase:'Nice job!'},{emoji:'⚡',phrase:'Zap! Awesome!'},

  {emoji:'👻',phrase:'Boo-yah!'},{emoji:'🥳',phrase:'Party time!'},{emoji:'🦕',phrase:'Dino-mite!'},{emoji:'🐳',phrase:'Whale done!'},
];
const fmt = c => '$' + (Math.max(0,c)/100).toFixed(2);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ---------------- state ---------------- */
let state = {
  screen:'loading', data:null, parentMode:false,
  pinEntry:'', pinError:false, pinPurpose:'home',
  addCents:0, addReason:REASONS[0].label, addDetails:'',
  spendJar:'spend', spendCents:0, spendReason:'',
  loggedInAs:'Mom', confirmDeleteId:null, celebrate:null,
  saveError:false, settingsStep:'menu', newPin1:'', newPin2:'', pinMsg:'', exportCopied:false,
};

/* ---------------- storage (Firebase Firestore — no login, live cross-device sync) ---------------- */
async function loadRemoteDoc(){
  const snap = await docRef.get();
  return snap.exists ? snap.data() : null;
}
async function saveRemoteDoc(data){
  await docRef.set(data);
}
async function persist(){
  try{ await saveRemoteDoc(state.data); state.saveError=false; }
  catch(e){ state.saveError=true; }
  render();
}
async function refreshFromRemote(){
  try{
    const d = await loadRemoteDoc();
    if(d){ d.pin = d.pin || '1234'; state.data = d; render(); }
  }catch(e){ /* stay on local copy if offline */ }
}
let unsubscribeLive = null;
function attachLiveSync(){
  if(unsubscribeLive) return;
  unsubscribeLive = docRef.onSnapshot((snap) => {
    if(!snap.exists) return;
    const d = snap.data();
    d.pin = d.pin || '1234';
    state.data = d;
    render();
  }, () => { /* ignore transient listener errors, focus-based refresh still works */ });
}

/* ---------------- boot ---------------- */
async function boot(){
  try{
    let data = await loadRemoteDoc();
    if(!data){
      data = { balances:{save:0,give:0,spend:0}, transactions:[], pin:'1234' };
      await saveRemoteDoc(data);
    }
    if(!data.pin) data.pin = '1234';
    state.data = data;
    state.screen = 'home';
    attachLiveSync();
  }catch(e){
    state.screen = 'boot-error';
    state.bootErrorMsg = (e && e.message) ? e.message : String(e);
  }
  render();
}
window.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && state.data) refreshFromRemote(); });
window.addEventListener('focus', () => { if(state.data) refreshFromRemote(); });

/* ---------------- actions ---------------- */
function splitCents(cents){
  const base = Math.floor(cents/3); let rem = cents - base*3;
  const s = { save:base, give:base, spend:base };
  if(rem>0){ s.save++; rem--; } if(rem>0){ s.give++; rem--; }
  return s;
}
function doAddAllowance(){
  const cents = state.addCents; if(cents<=0) return;
  const reason = state.addDetails.trim() ? (state.addReason + ' — ' + state.addDetails.trim()) : state.addReason;
  const splits = splitCents(cents);
  state.data.balances.save += splits.save; state.data.balances.give += splits.give; state.data.balances.spend += splits.spend;
  state.data.transactions.unshift({ id:uid(), type:'earn', date:new Date().toISOString(), amount:cents, reason, splits, by:state.loggedInAs });
  state.data.transactions = state.data.transactions.slice(0,300);
  state.celebrate = { cents, theme: CELEBRATION_THEMES[Math.floor(Math.random()*CELEBRATION_THEMES.length)] };
  state.addCents=0; state.addReason=REASONS[0].label; state.addDetails='';
  state.screen='home'; persist();
  setTimeout(()=>{ state.celebrate=null; render(); }, 5000);
}
function doSpend(){
  const jar = state.spendJar, cents = state.spendCents;
  if(cents<=0 || cents>state.data.balances[jar]) return;
  state.data.balances[jar] -= cents;
  state.data.transactions.unshift({ id:uid(), type:'spend', date:new Date().toISOString(), amount:cents, jar, reason: state.spendReason||'Spent', by:state.loggedInAs });
  state.data.transactions = state.data.transactions.slice(0,300);
  state.spendCents=0; state.spendReason=''; state.screen='home'; persist();
}
function deleteTransaction(id){
  const tx = state.data.transactions.find(t=>t.id===id); if(!tx) return;
  if(tx.type==='earn'){
    state.data.balances.save -= tx.splits.save; state.data.balances.give -= tx.splits.give; state.data.balances.spend -= tx.splits.spend;
  } else { state.data.balances[tx.jar] += tx.amount; }
  ['save','give','spend'].forEach(k=>{ state.data.balances[k] = Math.max(0, state.data.balances[k]); });
  state.data.transactions = state.data.transactions.filter(t=>t.id!==id);
  state.confirmDeleteId=null; persist();
}
function resetData(){
  state.data = { balances:{save:0,give:0,spend:0}, transactions:[], pin: state.data.pin };
  state.settingsStep='menu'; persist();
}
function savePin(p){ state.data.pin=p; persist(); }
function pressDigit(d){
  if(state.pinEntry.length>=4) return;
  state.pinEntry += d;
  if(state.pinEntry.length===4){
    setTimeout(()=>{
      if(state.pinEntry===state.data.pin){ state.parentMode=true; state.screen=state.pinPurpose; state.pinEntry=''; render(); }
      else { state.pinError=true; render(); setTimeout(()=>{ state.pinError=false; state.pinEntry=''; render(); }, 500); }
    }, 120);
  }
  render();
}
function toggleLock(){
  if(state.parentMode){ state.parentMode=false; state.screen='home'; } else { state.pinPurpose='home'; state.screen='pin'; }
  render();
}

function coinSvg(kind){
  if(kind==='dollar'){
    return '<svg width="72" height="40" viewBox="0 0 72 40"><defs><linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#8FE3A6"/><stop offset="100%" stop-color="#4FAF6B"/></linearGradient></defs>' +
      '<rect x="1" y="1" width="70" height="38" rx="6" fill="url(#billGrad)" stroke="#2E6E45" stroke-width="2"/>' +
      '<rect x="6" y="6" width="60" height="28" rx="3" fill="none" stroke="#DFF7E6" stroke-width="1.2" stroke-dasharray="3 2"/>' +
      '<text x="36" y="25" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="16" fill="#F4FFF7">$1</text></svg>';
  }
  const size = kind==='quarter'?60:48, label = kind==='quarter'?'25¢':'10¢', fsz = kind==='quarter'?13:11;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 60 60"><defs><radialGradient id="coin-'+kind+'" cx="35%" cy="30%" r="75%">' +
    '<stop offset="0%" stop-color="#F1F5FB"/><stop offset="55%" stop-color="#C7D0E0"/><stop offset="100%" stop-color="#93A0B8"/></radialGradient></defs>' +
    '<circle cx="30" cy="30" r="26" fill="url(#coin-'+kind+')" stroke="#7C8AA5" stroke-width="2"/>' +
    '<circle cx="30" cy="30" r="20" fill="none" stroke="#DDE4EF" stroke-width="1.4"/>' +
    '<text x="30" y="35" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="'+fsz+'" fill="#5A6784">'+label+'</text></svg>';
}

/* ---------------- screens ---------------- */
function screenHome(){
  const b = state.data.balances, total = b.save+b.give+b.spend;
  const cards = ['save','give','spend'].map(k=>{
    const j = JARS[k], ic = k==='save'?'rocket':(k==='give'?'heart':'gift');
    return '<div class="money-card">' +
      '<div class="money-badge" style="background:radial-gradient(circle at 35% 30%, '+j.color+', '+j.color+'CC); box-shadow:0 6px 18px '+j.glow+';">'+iconSvg(ic,'#0B1226',30,j.color)+'</div>' +
      '<div class="money-amt">'+fmt(b[k])+'</div>' +
      '<div class="money-label" style="color:'+j.color+'">'+j.label+'</div>' +
      '<div class="money-sub">'+j.sub+'</div></div>';
  }).join('');
  const actions = state.parentMode ?
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:22px;">' +
      '<button class="primary-btn" style="background:#FF6B4A;color:#0B1226;" onclick="state.screen=\'add\';render();">+ Add Allowance</button>' +
      '<button class="primary-btn" style="background:#4ADEDE;color:#0B1226;" onclick="state.screen=\'spend\';render();">− Record Spending</button>' +
      '<button class="ghost-btn" onclick="state.screen=\'settings\';render();">⚙ Settings</button>' +
    '</div>' :
    '<div style="text-align:center;margin-top:22px;color:#5E6E92;font-size:13px;">🔒 Ask a grown-up to add allowance</div>';
  const log = state.data.transactions.length===0 ?
    '<div style="margin-top:26px;text-align:center;color:#5E6E92;font-size:13px;">No missions yet. Earn your first coins! 🚀</div>' :
    '<div style="margin-top:26px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
        '<div style="font-family:\'Fredoka\',sans-serif;font-weight:600;font-size:14px;color:#F4F6FB;">Mission Log</div>' +
        (state.parentMode ? '<div style="font-size:10.5px;color:#5E6E92;">Tap 🗑 to remove</div>' : '') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;max-height:260px;overflow-y:auto;">' +
      state.data.transactions.slice(0,20).map(t=>{
        const icon = t.type==='earn' ? '✨' : (t.jar==='give' ? '💗' : '🎁');
        const label = t.reason || (t.type==='earn' ? 'Allowance' : ('Spent from '+JARS[t.jar].label));
        const dstr = new Date(t.date).toLocaleDateString(undefined,{month:'short',day:'numeric'});
        const del = state.parentMode ? (
          state.confirmDeleteId===t.id ?
            '<button onclick="deleteTransaction(\''+t.id+'\')" style="background:#FF6B6B;border:none;border-radius:8px;color:#0B1226;font-weight:800;font-size:10.5px;padding:5px 8px;cursor:pointer;">Confirm?</button>' :
            '<button onclick="state.confirmDeleteId=\''+t.id+'\';render();" style="background:none;border:none;cursor:pointer;font-size:15px;padding:2px;opacity:0.7;">🗑</button>'
        ) : '';
        return '<div class="log-row"><div style="display:flex;align-items:center;gap:8px;min-width:0;">' +
          '<span style="font-size:16px;">'+icon+'</span><div style="min-width:0;">' +
          '<div class="log-title">'+esc(label)+'</div><div class="log-sub">'+dstr+' · '+esc(t.by)+'</div></div></div>' +
          '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
          '<div class="log-amt" style="color:'+(t.type==='earn'?'#7CE38B':'#FF9E7A')+';">'+(t.type==='earn'?'+':'-')+fmt(t.amount)+'</div>' + del +
          '</div></div>';
      }).join('') + '</div></div>';
  return '<div class="content"><div style="text-align:center;margin-bottom:18px;">' +
    '<div style="color:#8FA3C7;font-weight:800;font-size:13px;letter-spacing:1px;">TOTAL MONEY</div>' +
    '<div style="font-family:\'Fredoka\',sans-serif;font-weight:700;font-size:48px;color:#F4F6FB;line-height:1.1;">'+fmt(total)+'</div>' +
    '</div><div class="money-row">'+cards+'</div>' + actions + log + '</div>';
}

function screenPin(){
  const dots = [0,1,2,3].map(i => '<div class="pindot" style="background:'+(i<state.pinEntry.length ? (state.pinError?'#FF6B6B':'#4ADEDE') : '#233052')+'"></div>').join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'].map(d=>{
    if(d==='') return '<div></div>';
    const action = d==='del' ? "state.pinEntry=state.pinEntry.slice(0,-1);render();" : "pressDigit('"+d+"')";
    return '<button class="pinkey" onclick="'+action+'">'+(d==='del'?'⌫':d)+'</button>';
  }).join('');
  return '<div class="content" style="text-align:center;padding-top:28px;">' +
    '<div style="font-size:30px;">🔒</div>' +
    '<div style="font-family:\'Fredoka\',sans-serif;font-weight:600;font-size:16px;color:#F4F6FB;margin:10px 0 18px;">Grown-up PIN</div>' +
    '<div class="pindots'+(state.pinError?' shake':'')+'">'+dots+'</div>' +
    '<div class="pinpad">'+keys+'</div>' +
    '<button class="ghost-btn" style="margin-top:20px;width:200px;margin-left:auto;margin-right:auto;" onclick="state.screen=\'home\';render();">Cancel</button>' +
    '</div>';
}

function screenAdd(){
  const cents = state.addCents, splits = splitCents(cents);
  const coins = ['dime','quarter','dollar'].map(kind=>{
    const val = kind==='dime'?10:(kind==='quarter'?25:100), label = kind==='dime'?'10¢':(kind==='quarter'?'25¢':'$1');
    return '<button class="coin-btn" onclick="state.addCents+='+val+';render();">'+coinSvg(kind)+
      '<span style="font-family:\'Fredoka\',sans-serif;font-weight:700;font-size:14px;color:#F4F6FB;">'+label+'</span></button>';
  }).join('');
  const chips = REASONS.map(r=>'<button class="chip'+(state.addReason===r.label?' active':'')+'" onclick="state.addReason=\''+r.label+'\';render();">'+iconSvg(r.icon,state.addReason===r.label?'#FF6B4A':'#8FA3C7',13)+' '+r.label+'</button>').join('');
  return '<div class="content">' + screenHeaderHtml('Add Allowance','#FF6B4A') +
    '<div class="label">Tap to add money</div>' +
    '<div style="display:flex;gap:14px;justify-content:center;margin-bottom:14px;">'+coins+'</div>' +
    '<div style="text-align:center;margin-bottom:14px;"><button class="ghost-btn" style="width:140px;padding:8px 0;margin:0 auto;" onclick="state.addCents=0;render();">↺ Clear</button></div>' +
    '<div style="text-align:center;margin:18px 0;"><div style="font-family:\'Fredoka\',sans-serif;font-weight:700;font-size:40px;color:#F4F6FB;">'+fmt(cents)+'</div>' +
    (cents>0 ? '<div style="font-size:12px;color:#5E6E92;margin-top:4px;">→ '+fmt(splits.save)+' save · '+fmt(splits.give)+' give · '+fmt(splits.spend)+' spend</div>' : '') + '</div>' +
    '<div class="label">Why?</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">'+chips+'</div>' +
    '<div class="label">Details (optional)</div>' +
    '<input class="text-input" placeholder="e.g. finished chores, did homework, helped sister" value="'+esc(state.addDetails)+'" oninput="state.addDetails=this.value;" />' +
    '<button class="primary-btn" style="background:#FF6B4A;color:#0B1226;margin-top:20px;opacity:'+(cents===0?'0.4':'1')+';" '+(cents===0?'disabled':'')+' onclick="doAddAllowance();">✨ Give '+(cents>0?fmt(cents):'Allowance')+'</button>' +
    '</div>';
}

function screenSpend(){
  const b = state.data.balances, cents = state.spendCents, jar = state.spendJar;
  const jarBtns = ['give','spend'].map(k=>{
    const j = JARS[k], active = jar===k;
    return '<button onclick="state.spendJar=\''+k+'\';render();" style="flex:1;padding:10px 0;border-radius:12px;border:2px solid '+(active?j.color:'#233052')+';background:'+(active?j.color+'22':'#141B33')+';color:'+j.color+';font-family:\'Fredoka\',sans-serif;font-weight:700;cursor:pointer;">'+j.label+' · '+fmt(b[k])+'</button>';
  }).join('');
  const coins = ['dime','quarter','dollar'].map(kind=>{
    const val = kind==='dime'?10:(kind==='quarter'?25:100), label = kind==='dime'?'Dime':(kind==='quarter'?'Quarter':'Dollar');
    return '<button onclick="state.spendCents+='+val+';render();" style="padding:10px 14px;border-radius:12px;border:none;cursor:pointer;background:#1E2748;color:#FFD84A;font-family:\'Fredoka\',sans-serif;font-weight:600;font-size:13px;">'+label+'</button>';
  }).join('');
  const overLimit = cents>b[jar];
  return '<div class="content">' + screenHeaderHtml('Record Spending','#4ADEDE') +
    '<div class="label">Which jar?</div><div style="display:flex;gap:8px;margin-bottom:16px;">'+jarBtns+'</div>' +
    '<div style="text-align:center;padding:10px 12px;background:#141B33;border-radius:10px;color:#8FA3C7;font-size:12px;margin-bottom:16px;">🔒 Savings jar stays safe and isn\'t spent from here</div>' +
    '<div class="label">Amount</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'+coins+
      '<button onclick="state.spendCents=0;render();" style="padding:10px 14px;border-radius:12px;border:none;cursor:pointer;background:#1E2748;color:#8FA3C7;font-weight:600;font-size:13px;">Clear</button></div>' +
    '<div style="text-align:center;margin:10px 0 18px;"><div style="font-family:\'Fredoka\',sans-serif;font-weight:700;font-size:36px;color:#F4F6FB;">'+fmt(cents)+'</div></div>' +
    '<div class="label">What for?</div>' +
    '<input class="text-input" placeholder="e.g. Robot toy" value="'+esc(state.spendReason)+'" oninput="state.spendReason=this.value;" />' +
    '<button class="primary-btn" style="background:#4ADEDE;color:#0B1226;margin-top:20px;opacity:'+((cents===0||overLimit)?'0.4':'1')+';" '+((cents===0||overLimit)?'disabled':'')+' onclick="doSpend();">✓ Record '+(cents>0?fmt(cents):'Spending')+'</button>' +
    (overLimit ? '<div style="text-align:center;color:#FF9E7A;font-size:12px;margin-top:8px;">Not enough in that jar yet</div>' : '') +
    '</div>';
}

function screenSettings(){
  let body;
  if(state.settingsStep==='menu'){
    body = '<div style="display:flex;flex-direction:column;gap:10px;">' +
      '<div><div class="label">Logged in as</div><div style="display:flex;gap:8px;">' +
      ['Mom','Dad'].map(n=>'<button class="chip'+(state.loggedInAs===n?' active':'')+'" onclick="state.loggedInAs=\''+n+'\';render();">'+n+'</button>').join('') +
      '</div></div>' +
      '<button class="ghost-btn" onclick="state.settingsStep=\'changePin\';render();">Change Parent PIN</button>' +
      '<button class="ghost-btn" onclick="state.screen=\'export\';render();">⧉ Export for Notion</button>' +
      '<button class="ghost-btn" style="border-color:#FF6B6B;color:#FF9E7A;" onclick="state.settingsStep=\'confirmReset\';render();">Reset All Data</button>' +
      '</div>';
  } else if(state.settingsStep==='changePin'){
    body = '<div><div class="label">New 4-digit PIN</div>' +
      '<input class="text-input" maxlength="4" placeholder="••••" value="'+esc(state.newPin1)+'" oninput="state.newPin1=this.value.replace(/\\D/g,\'\').slice(0,4);" />' +
      '<div class="label">Confirm PIN</div>' +
      '<input class="text-input" maxlength="4" placeholder="••••" value="'+esc(state.newPin2)+'" oninput="state.newPin2=this.value.replace(/\\D/g,\'\').slice(0,4);" />' +
      (state.pinMsg ? '<div style="color:#FF9E7A;font-size:12px;margin-bottom:8px;">'+esc(state.pinMsg)+'</div>' : '') +
      '<button class="primary-btn" style="background:#4ADEDE;color:#0B1226;" onclick="' +
        "if(state.newPin1.length!==4){state.pinMsg='PIN must be 4 digits';render();return;} if(state.newPin1!==state.newPin2){state.pinMsg='PINs don\\'t match';render();return;} savePin(state.newPin1); state.settingsStep='menu'; state.pinMsg=''; state.newPin1=''; state.newPin2=''; render();" +
      '">Save PIN</button>' +
      '<button class="ghost-btn" style="margin-top:8px;" onclick="state.settingsStep=\'menu\';state.pinMsg=\'\';render();">Cancel</button></div>';
  } else {
    body = '<div style="text-align:center;">' +
      '<div style="color:#F4F6FB;margin-bottom:16px;">This clears all balances and history for good. Are you sure?</div>' +
      '<button class="primary-btn" style="background:#FF6B6B;color:#0B1226;" onclick="resetData();">Yes, reset everything</button>' +
      '<button class="ghost-btn" style="margin-top:8px;" onclick="state.settingsStep=\'menu\';render();">Cancel</button></div>';
  }
  const errBanner = state.saveError ? '<div style="background:#3A1B1B;color:#FF9E7A;padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;">Couldn\'t save last change — check connection and try again.</div>' : '';
  return '<div class="content">' + screenHeaderHtml('Settings','#8FA3C7') + errBanner + body +
    '<div style="margin-top:18px;font-size:11px;color:#5E6E92;text-align:center;">Current PIN: '+state.data.pin.replace(/./g,'•')+'</div></div>';
}

function screenExport(){
  const chrono = [...state.data.transactions].reverse();
  let bal = {save:0,give:0,spend:0}; const rows=[];
  chrono.forEach(t=>{
    const date = t.date.slice(0,10);
    if(t.type==='earn'){
      bal = {save:bal.save+t.splits.save, give:bal.give+t.splits.give, spend:bal.spend+t.splits.spend};
      rows.push(['Earned '+fmt(t.amount)+' — '+t.reason, date, 'Earned', (t.amount/100).toFixed(2),
        (t.splits.save/100).toFixed(2),(t.splits.give/100).toFixed(2),(t.splits.spend/100).toFixed(2),
        'All', t.reason, t.by, (bal.save/100).toFixed(2),(bal.give/100).toFixed(2),(bal.spend/100).toFixed(2)].join('\t'));
    } else {
      bal = {...bal, [t.jar]: bal[t.jar]-t.amount};
      rows.push(['Spent '+fmt(t.amount)+' — '+t.reason, date, 'Spent', (t.amount/100).toFixed(2), '', '', '',
        JARS[t.jar].label, t.reason, t.by, (bal.save/100).toFixed(2),(bal.give/100).toFixed(2),(bal.spend/100).toFixed(2)].join('\t'));
    }
  });
  rows.reverse();
  const header = 'Entry\tDate\tType\tAmount\tSave Split\tGive Split\tSpend Split\tJar\tReason\tAdded By\tSave Balance\tGive Balance\tSpend Balance';
  const text = [header, ...rows].join('\n');
  window.__exportText = text;
  return '<div class="content">' + screenHeaderHtml('Export for Notion','#8FA3C7') +
    '<div style="font-size:12px;color:#8FA3C7;margin-bottom:10px;">Copy this, then paste as rows into your "Mason\'s Allowance Tracker" Notion database — the columns line up exactly.</div>' +
    '<textarea class="text-input" readonly style="height:160px;font-family:monospace;font-size:10.5px;" onfocus="this.select();">'+esc(text)+'</textarea>' +
    '<button class="primary-btn" style="background:#4ADEDE;color:#0B1226;" onclick="' +
      "navigator.clipboard.writeText(window.__exportText).then(()=>{state.exportCopied=true;render();setTimeout(()=>{state.exportCopied=false;render();},1500);}).catch(()=>{});" +
    '">⧉ '+(state.exportCopied?'Copied!':'Copy to clipboard')+'</button>' +
    '</div>';
}

function screenHeaderHtml(title, accent){
  return '<div class="screen-header"><button class="back-btn" onclick="state.screen=\'home\';render();">‹</button>' +
    '<span class="screen-title" style="color:'+accent+';">'+title+'</span></div>';
}

/* ---------------- celebration overlay ---------------- */
function celebrationHtml(){
  if(!state.celebrate) return '';
  const theme = state.celebrate.theme;
  let pieces = '';
  for(let i=0;i<30;i++){
    const angle = Math.random()*Math.PI*2, dist = 60+Math.random()*130;
    const dx = Math.round(Math.cos(angle)*dist), dy = Math.round(Math.sin(angle)*dist*0.6-40);
    const rot = Math.round((Math.random()-0.5)*360), delay = Math.round(Math.random()*900);
    const dur = Math.round(2100+Math.random()*1500 + 1100), size = Math.round(18+Math.random()*18);
    const char = Math.random()<0.75 ? theme.emoji : ['⭐','✨','🎉'][Math.floor(Math.random()*3)];
    pieces += '<div class="confetti-piece" style="position:absolute;top:46%;left:50%;font-size:'+size+'px;' +
      'animation:confettiBurst '+dur+'ms cubic-bezier(.2,.8,.3,1) '+delay+'ms forwards;' +
      '--dx:'+dx+'px;--dy:'+dy+'px;--rot:'+rot+'deg;">'+char+'</div>';
  }
  return '<div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:28px;">' + pieces +
    '<div style="position:absolute;top:38%;left:0;right:0;text-align:center;animation:popIn 500ms cubic-bezier(.34,1.56,.64,1) forwards;">' +
    '<div style="font-family:\'Fredoka\',sans-serif;font-weight:700;font-size:34px;color:#7CE38B;text-shadow:0 2px 12px rgba(0,0,0,0.6);">+'+fmt(state.celebrate.cents)+'!</div>' +
    '<div style="font-weight:800;font-size:14px;color:#F4F6FB;margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,0.6);">'+theme.emoji+' '+theme.phrase+'</div>' +
    '</div></div>';
}

/* ---------------- render ---------------- */
function render(){
  const root = document.getElementById('frame');
  if(state.screen==='loading'){
    root.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#8FA3C7;">Loading Mason\'s money...</div>';
    return;
  }
  if(state.screen==='boot-error'){
    root.innerHTML = '<div style="padding:40px 20px;text-align:center;">' +
      '<div style="color:#FF9E7A;margin-bottom:10px;">Couldn\'t connect. Check your internet connection and try again.</div>' +
      '<div style="color:#5E6E92;font-size:11px;font-family:monospace;margin-bottom:16px;">'+esc(state.bootErrorMsg||'')+'</div>' +
      '<button class="ghost-btn" style="width:160px;margin:0 auto;" onclick="boot();">↻ Try again</button>' +
      '</div>';
    return;
  }
  const topbar = '<div class="topbar"><div class="brand"><div class="avatar">'+masonAvatarSvg()+'</div>' +
    '<span class="titletext">Mason\'s Allowance</span></div>' +
    '<div class="topbtns">' +
    '<button class="iconbtn" title="Refresh" onclick="refreshFromRemote();">↻</button>' +
    '<button class="iconbtn" title="Parent mode" onclick="toggleLock();">'+(state.parentMode?'🔓':'🔒')+'</button>' +
    '</div></div>';
  let body = '';
  if(state.screen==='home') body = screenHome();
  else if(state.screen==='pin') body = screenPin();
  else if(state.screen==='add') body = screenAdd();
  else if(state.screen==='spend') body = screenSpend();
  else if(state.screen==='settings') body = screenSettings();
  else if(state.screen==='export') body = screenExport();
  root.innerHTML = topbar + body + celebrationHtml();
}

boot();
</script>
</body>
</html>
